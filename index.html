body{background:var(--bg);color:var(--fg);position:relative;isolation:isolate;font-family:var(--f-body);font-size:16px;line-height:1.55}
.wrap{max-width:520px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-direction:column;gap:4px}
.logo{font-family:var(--f-display);font-weight:900;font-size:clamp(2.2rem,11vw,3.2rem);letter-spacing:.08em;color:#fff;line-height:1.1;
  text-shadow:3px 3px 0 var(--purple),6px 6px 0 var(--orange);margin:0;transform:rotate(-2deg);transform-origin:left;width:max-content;max-width:100%}
.sub{font-family:var(--f-serif);color:var(--fg);font-size:.95rem;margin:8px 0 0;background:var(--surface);padding:4px 12px;border-radius:99px;width:max-content;max-width:100%;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.stage{position:relative;background:var(--surface);border-radius:14px;padding:12px;border:1px solid var(--line)}
#preview{display:block;width:auto;height:auto;max-width:100%;max-height:64vh;margin:0 auto;border-radius:4px;touch-action:pan-y pinch-zoom;box-shadow:0 6px 18px rgba(40,30,10,.18)}
#preview.moving{touch-action:none;cursor:grab;outline:4px solid var(--jelly);outline-offset:3px}
.movebar{display:flex;justify-content:center;margin-top:10px}
.movebtn{appearance:none;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);font:500 .9rem var(--f-body);padding:8px 16px;border-radius:99px;cursor:pointer}
.movebtn{display:inline-flex;align-items:center;gap:6px}
.movebtn svg{width:18px;height:18px}
.adjust{margin-top:10px;padding:12px 14px;border-radius:12px;background:var(--bg);display:flex;flex-direction:column;gap:8px}
.adjust-tip{margin:0;font-size:.88rem;color:var(--fg);text-align:center}
.zoomrow{display:flex;align-items:center;gap:10px}
.zoomrow input{flex:1;min-width:0}
.zi{font-weight:700;color:var(--muted);width:1.2em;text-align:center}
.linkbtn{align-self:center;appearance:none;border:0;background:none;color:var(--hint);font:500 .82rem var(--f-body);text-decoration:underline;cursor:pointer;padding:4px}
.movebtn[aria-pressed="true"]{background:var(--jelly);border-color:var(--jelly);color:#2F2A22;font-weight:700}
.hint{font-size:.85rem;color:var(--muted);margin:8px 2px 0;text-align:center}
.tag{position:absolute;top:22px;left:22px;background:var(--purple);color:#fff;font-size:.75rem;padding:2px 10px;border-radius:99px;letter-spacing:.1em}
.shoot{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{appearance:none;border:0;border-radius:12px;padding:14px 12px;font:700 1.05rem var(--f-display);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px}
.btn.primary{background:var(--btn);color:var(--btn-fg)}
.btn.ghost{background:transparent;color:var(--fg);border:2px solid var(--fg)}
.btn:focus-visible,input:focus-visible,.sw:focus-visible,.seg button:focus-visible{outline:3px solid var(--purple);outline-offset:2px}
.btn svg{width:22px;height:22px}
.opts{display:flex;flex-direction:column;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.row{display:flex;flex-direction:column;gap:8px;min-width:0}
.row > label,.lbl{font-family:var(--f-display);font-weight:700;font-size:.9rem;letter-spacing:.05em}
.lbl small,.row > label small{font-family:var(--f-body);font-weight:500;font-size:.8rem;color:var(--hint);letter-spacing:0;margin-left:4px}
.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;background:var(--bg);padding:4px;border-radius:10px}
.seg.three{grid-template-columns:repeat(3,1fr)}
.seg.four{grid-template-columns:repeat(4,1fr)}
.seg.five{grid-template-columns:repeat(5,1fr)}
.seg button{border:0;background:transparent;color:var(--fg);font:500 .92rem var(--f-body);padding:9px 4px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.15);font-weight:700}
.swatches{display:flex;gap:12px;flex-wrap:wrap}
.sw{width:52px;height:52px;border-radius:10px;border:2px solid var(--line);cursor:pointer;position:relative;padding:0;background-size:cover}
.sw[aria-pressed="true"]{border-color:var(--fg);box-shadow:0 0 0 3px var(--bg) inset}
.swname{font-size:.72rem;color:var(--muted);text-align:center;margin-top:3px}
.swwrap{display:flex;flex-direction:column;align-items:center}
input[type=text],input[type=number]{width:100%;font:1rem var(--f-body);padding:11px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg)}
input[type=range]{width:100%;accent-color:var(--purple)}
.two{display:flex;flex-direction:column;gap:16px}
.two > .row{min-width:0}
.done{width:100%;font-size:1.2rem;min-height:60px;background:var(--purple);color:#fff}
/* result sheet */
.sheet{position:fixed;inset:0;background:rgba(20,18,12,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));gap:14px;z-index:10;overflow-y:auto}
.sheet img{max-width:min(100%,460px);max-height:62vh;width:auto;border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.5);-webkit-touch-callout:default;user-select:auto}
.sheet .say{color:#fff;text-align:center;max-width:420px;font-size:.98rem}
.sheet .say b{color:var(--jelly)}
.sheet .say p{margin:4px 0}
.sheet .acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.sheet .btn.ghost{color:#fff;border-color:#fff}
.sheet .btn.primary{background:#F2C14E;color:#2F2A22}
.btn.ig{background:linear-gradient(45deg,#F4A340,#E1306C 55%,#833AB4);color:#fff}
.sheet .say .small{font-size:.82rem;opacity:.8}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>

<div class="wrap">
  <header>
    <h1 class="logo">小人迷走中</h1>
    <p class="sub">嘉南中學聯合聚會 · 2026.10.1 ｜ 找到小人，就拍下來</p>
  </header>

  <div class="stage">
    <span class="tag" id="sampleTag">範例照片</span>
    <canvas id="preview" width="1080" height="1350" aria-label="拍立得預覽"></canvas>
    <div class="movebar"><button type="button" class="movebtn" id="move" aria-pressed="false" aria-controls="adjust">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M3 12h18M12 3l-3 3m3-3 3 3M12 21l-3-3m3 3 3-3M3 12l3-3m-3 3 3 3M21 12l-3-3m3 3-3 3"/></svg>
      <span id="moveLabel">調整圖片</span></button></div>
    <p class="hint" id="hint" hidden></p>
    <div class="adjust" id="adjust" hidden>
      <p class="adjust-tip">用手指<b>拖曳上面的照片</b>移動位置，拉下面的滑桿放大縮小。調好按「完成」。</p>
      <div class="zoomrow">
        <span class="zi" aria-hidden="true">－</span>
        <input id="zoom" type="range" min="1" max="3" step="0.01" value="1" aria-label="照片縮放">
        <span class="zi" aria-hidden="true">＋</span>
      </div>
      <button type="button" class="linkbtn" id="resetPos">回到原本的位置</button>
    </div>
  </div>

  <div class="shoot">
    <label class="btn primary" for="cam">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
      拍照
    </label>
    <label class="btn ghost" for="lib">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg>
      從相簿選
    </label>
    <input id="cam" type="file" accept="image/*" capture="environment" hidden>
    <input id="lib" type="file" accept="image/*" hidden>
  </div>

  <div class="opts">
    <div class="row">
      <span class="lbl">尺寸</span>
      <div class="seg" id="fmt">
        <button type="button" data-v="feed" aria-pressed="false">IG 貼文 4:5</button>
        <button type="button" data-v="story" aria-pressed="true">IG 限動 9:16</button>
      </div>
    </div>

    <div class="row">
      <span class="lbl">相框</span>
      <div class="swatches" id="frames">
        <div class="swwrap"><button type="button" class="sw" data-v="white" aria-pressed="true" style="background:#FBFAF6" aria-label="奶白"></button><div class="swname">奶白</div></div>
        <div class="swwrap"><button type="button" class="sw" data-v="jelly" aria-pressed="false" id="swJelly" aria-label="果凍"></button><div class="swname">果凍</div></div>
        <div class="swwrap"><button type="button" class="sw" data-v="matcha" aria-pressed="false" style="background:#BCC794" aria-label="抹茶"></button><div class="swname">抹茶</div></div>
        <div class="swwrap"><button type="button" class="sw" data-v="orange" aria-pressed="false" style="background:#F1A868" aria-label="橘子"></button><div class="swname">橘子</div></div>
        <div class="swwrap"><button type="button" class="sw" data-v="yellow" aria-pressed="false" style="background:#F4CF6A" aria-label="蜂蜜"></button><div class="swname">蜂蜜</div></div>
      </div>
    </div>

    <div class="row">
      <span class="lbl">站在相框旁的小人</span>
      <div class="seg five" id="fig">
        <button type="button" data-v="red" aria-pressed="true">紅帽子</button>
        <button type="button" data-v="green" aria-pressed="false">綠帽子</button>
        <button type="button" data-v="orange" aria-pressed="false">黃大衣</button>
        <button type="button" data-v="grey" aria-pressed="false">灰帽子</button>
        <button type="button" data-v="none" aria-pressed="false">不要</button>
      </div>
    </div>

    <div class="row">
      <label for="who">把「小人」換成你的綽號 <small>選填，最多 6 個字</small></label>
      <input id="who" type="text" maxlength="6" placeholder="例：阿布、Kevin、睡神">
    </div>

    <div class="two">
      <div class="row">
        <label for="num">印章 <small>最多 4 字，留空就不蓋章</small></label>
        <input id="num" type="text" maxlength="4" value="找到小人" placeholder="找到小人">
      </div>
      <div class="row">
        <label for="cap">寫一句話 <small>選填，最多 25 字</small></label>
        <input id="cap" type="text" maxlength="25" placeholder="我跟紅帽小人都在迷走">
      </div>
    </div>

    <div class="row">
      <span class="lbl">底部經文</span>
      <div class="seg three" id="verse">
        <button type="button" data-v="10" aria-pressed="true">路 19:10</button>
        <button type="button" data-v="5" aria-pressed="false">路 19:5</button>
        <button type="button" data-v="0" aria-pressed="false">不放</button>
      </div>
    </div>
  </div>

  <button class="btn done" id="make" type="button">完成，產生照片</button>
</div>

<div class="sheet" id="sheet" hidden>
  <img id="out" alt="完成的小人迷走中拍立得">
  <div class="acts" id="acts">
    <button class="btn primary" id="dl" hidden type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m-5-5 5 5 5-5M5 20h14"/></svg>
      下載到裝置</button>
    <button class="btn ig" id="share" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".6" fill="currentColor"/></svg>
      分享到 IG</button>
  </div>
  <div class="say">
    <p id="msg">按「分享到 IG」會跳出分享選單，選 Instagram 就能發貼文或限動，記得標 <b>#小人迷走中</b><br>也可以按分享以後選<b>「儲存影像」</b>，存到手機相簿</p>
    <p class="small" id="fallback">按鈕沒反應的話：<b>長按上面的照片</b> → 「加入照片」或「儲存圖片」，再到 IG 上傳</p>
  </div>
  <div class="acts">
    <button class="btn ghost" id="close" type="button">再拍一張</button>
  </div>
</div>

function cover(c,img,x,y,w,h){
  const s=Math.max(w/img.width,h/img.height);const iw=img.width*s,ih=img.height*s;
  c.drawImage(img,x+(w-iw)/2,y+(h-ih)/2,iw,ih);
}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}

function feet(c,x,y,s){ // two little footprints

}

    const iw=img.width*s,ih=img.height*s;
    const maxX=(iw-pw)/2,maxY=(ih-ph)/2;
    st.ox=Math.max(-maxX,Math.min(maxX,st.ox));st.oy=Math.max(-maxY,Math.min(maxY,st.oy));
    c.drawImage(img,px+(pw-iw)/2+st.ox,py+(ph-ih)/2+st.oy,iw,ih);
  }
  c.restore();
  c.strokeStyle="rgba(0,0,0,.12)";c.lineWidth=2;c.strokeRect(px+1,py+1,pw-2,ph-2);

  // stamp (default 找到小人, empty = no stamp)
  if(st.num){
    c.save();c.translate(952,118);c.rotate(.16);
    c.fillStyle="#6B4FD8";c.beginPath();c.arc(0,0,96,0,Math.PI*2);c.fill();
    c.strokeStyle="#fff";c.lineWidth=4;c.setLineDash([10,8]);c.beginPath();c.arc(0,0,82,0,Math.PI*2);c.stroke();c.setLineDash([]);
    c.fillStyle="#fff";c.textAlign="center";c.textBaseline="middle";
    const ch=[...st.num];let lines=ch.length<=2?[st.num]:[ch.slice(0,Math.ceil(ch.length/2)).join(""),ch.slice(Math.ceil(ch.length/2)).join("")];
    const longest=Math.max(...lines.map(l=>[...l].length));
    const fs=Math.min(lines.length===1?64:52,Math.floor(130/longest));
    c.font=`900 ${fs}px "Noto Sans TC",sans-serif`;
    const lh=fs*1.08;lines.forEach((l,i)=>c.fillText(l,0,(i-(lines.length-1)/2)*lh+3));
    c.restore();
  }

  // bottom band
  const dark="#3A3226";
  let y=1066;
  c.textAlign="left";c.textBaseline="alphabetic";
  const t=(st.who||"小人")+"迷走中";
  const chars=[...t];
  // shrink the title until it fits beside the footprints
  let fs=104,x,pos,gap;
  for(;;){
    c.font=`900 ${fs}px "Noto Sans TC",sans-serif`;gap=Math.round(fs*.11);
    x=0;pos=[];chars.forEach(ch=>{pos.push(x);x+=c.measureText(ch).width+gap;});
    if(x<=(st.fig==="none"?W-64-64-110:W-64-300-110)||fs<=48)break;fs-=4;
  }
  c.save();c.translate(64,y);c.rotate(-.025);
  [["#E8894A",8],["#6B4FD8",4]].forEach(([col,o])=>{c.fillStyle=col;chars.forEach((ch,i)=>c.fillText(ch,pos[i]+o,o));});
  c.fillStyle="#fff";c.strokeStyle="#6B4FD8";c.lineWidth=3;
  chars.forEach((ch,i)=>{c.strokeText(ch,pos[i],0);c.fillText(ch,pos[i],0);});
  c.restore();
  feet(c,64+x+28,y-Math.round(fs*.36),1.1*fs/92);

  const verse=VERSES[st.verse];
  if(st.cap){
    c.fillStyle=dark;const maxW=(st.fig==="none"?W-128:W-64-300);
    let cfs=42,lines;
    for(;;){c.font=`400 ${cfs}px "Huninn","Noto Sans TC",sans-serif`;
      lines=[];let cur="";
      for(const ch of [...st.cap]){if(c.measureText(cur+ch).width>maxW&&cur){lines.push(cur);cur=ch;}else cur+=ch;}
      if(cur)lines.push(cur);
      if(lines.length<=2||cfs<=30)break;cfs-=2;}
    lines.slice(0,2).forEach((l,i)=>c.fillText(l,64,y+80+i*Math.round(cfs*1.22)));
  }
  y=1250;
  if(verse){
    c.fillStyle=dark;c.globalAlpha=.85;c.font='600 27px "Noto Serif TC",serif';
    c.fillText(`「${verse[0]}」${verse[1]}`,64,y);c.globalAlpha=1;
  }
  // footer line
  c.fillStyle=dark;c.globalAlpha=.7;c.font='600 25px "Noto Serif TC",serif';
  c.fillText("嘉南中學聯合聚會　2026.10.1　#小人迷走中",64,1300);
  c.globalAlpha=1;c.textAlign="left";

  const fig=FIGS[st.fig];
  if(fig&&fig.complete&&fig.naturalWidth){
    const fh=410,fw=fig.naturalWidth*fh/fig.naturalHeight;
    const fx=W-70-fw,fy=H-28-fh;
    c.save();c.fillStyle="rgba(60,40,20,.22)";c.filter="blur(6px)";
    c.beginPath();c.ellipse(fx+fw*.5,H-34,fw*.55,14,0,0,Math.PI*2);c.fill();c.restore();
    c.drawImage(fig,fx,fy,fw,fh);
  }
}

let pol=document.createElement("canvas");pol.width=W;pol.height=H;const pctx=pol.getContext("2d");
const STORY_SCALE=.84;
function render(){
  pctx.clearRect(0,0,W,H);drawPolaroid(pctx);
  if(st.fmt==="feed"){
    if(cv.height!==H){cv.width=W;cv.height=H;}
    ctx.drawImage(pol,0,0);
  }else{
    const SH=1920;if(cv.height!==SH){cv.width=W;cv.height=SH;}
    if(bgImg.complete&&bgImg.naturalWidth)cover(ctx,bgImg,0,0,W,SH);else{ctx.fillStyle="#E9C77A";ctx.fillRect(0,0,W,SH);}
    ctx.fillStyle="rgba(40,30,15,.10)";ctx.fillRect(0,0,W,SH);
    ctx.save();ctx.translate(W/2,930);ctx.rotate(-.035);
    ctx.shadowColor="rgba(40,25,5,.35)";ctx.shadowBlur=40;ctx.shadowOffsetY=18;
    const w=W*STORY_SCALE,h=H*STORY_SCALE;
    ctx.fillStyle="#000";ctx.fillRect(-w/2,-h/2,w,h);
    ctx.shadowColor="transparent";ctx.drawImage(pol,-w/2,-h/2,w,h);ctx.restore();
    ctx.fillStyle="#fff";ctx.textAlign="center";ctx.font='700 40px "Noto Sans TC",sans-serif';
    ctx.shadowColor="rgba(0,0,0,.35)";ctx.shadowBlur=12;
    ctx.fillText("我找到小人了！你呢？",W/2,230);ctx.shadowColor="transparent";ctx.textAlign="left";
  }
}
async function refresh(){await ensureFonts();render();}

// inputs
async function takeFile(f){
  if(!f)return;
  const url=URL.createObjectURL(f);
  try{st.img=await loadImg(url);st.isSample=false;document.getElementById("hint").hidden=true;st.zoom=1;st.ox=st.oy=0;
    document.getElementById("zoom").value=1;document.getElementById("sampleTag").hidden=true;refresh();}
  catch(e){const h=document.getElementById("hint");h.textContent="這張照片讀不進來，換一張試試看（格式請用 JPG 或 PNG）";h.hidden=false;}
}
["cam","lib"].forEach(id=>document.getElementById(id).addEventListener("change",e=>{takeFile(e.target.files[0]);e.target.value="";}));

function seg(id,key){document.getElementById(id).addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  document.querySelectorAll(`#${id} button`).forEach(x=>x.setAttribute("aria-pressed",x===b));
  st[key]=b.dataset.v;refresh();});}
seg("fmt","fmt");seg("fig","fig");seg("frames","frame");seg("verse","verse");
document.getElementById("num").addEventListener("input",e=>{st.num=[...e.target.value.trim()].slice(0,4).join("");refresh();});
document.getElementById("who").addEventListener("input",e=>{st.who=[...e.target.value.trim()].slice(0,6).join("");refresh();});
document.getElementById("cap").addEventListener("input",e=>{st.cap=[...e.target.value].slice(0,25).join("");refresh();});
document.getElementById("zoom").addEventListener("input",e=>{st.zoom=+e.target.value;render();});

// drag to pan
let drag=null;
const moveBtn=document.getElementById("move");
const canMove=e=>e.pointerType==="mouse"||cv.classList.contains("moving");
moveBtn.addEventListener("click",()=>{const on=!cv.classList.contains("moving");
  cv.classList.toggle("moving",on);moveBtn.setAttribute("aria-pressed",on);
  document.getElementById("moveLabel").textContent=on?"完成":"調整圖片";
  document.getElementById("adjust").hidden=!on;});
document.getElementById("resetPos").addEventListener("click",()=>{st.zoom=1;st.ox=st.oy=0;document.getElementById("zoom").value=1;render();});
cv.addEventListener("pointerdown",e=>{if(!canMove(e))return;drag={x:e.clientX,y:e.clientY};cv.setPointerCapture(e.pointerId);cv.style.cursor="grabbing";});
cv.addEventListener("pointermove",e=>{if(!drag)return;
  const k=cv.width/cv.getBoundingClientRect().width/(st.fmt==="story"?STORY_SCALE:1);
  st.ox+=(e.clientX-drag.x)*k;st.oy+=(e.clientY-drag.y)*k;drag={x:e.clientX,y:e.clientY};render();});
const end=()=>{drag=null;cv.style.cursor="grab";};
cv.addEventListener("pointerup",end);cv.addEventListener("pointercancel",end);
cv.addEventListener("wheel",e=>{e.preventDefault();st.zoom=Math.max(1,Math.min(3,st.zoom-e.deltaY*.002));document.getElementById("zoom").value=st.zoom;render();},{passive:false});

// output
let lastBlob=null;
const FNAME=()=>((st.who||"小人")+"迷走中.jpg");
const msg=t=>{document.getElementById("msg").innerHTML=t;};
document.getElementById("make").addEventListener("click",async()=>{
  await refresh();
  document.getElementById("out").src=cv.toDataURL("image/jpeg",.92);
  document.getElementById("sheet").hidden=false;
  msg('按「分享到 IG」會跳出分享選單，選 Instagram 就能發貼文或限動，記得標 <b>#小人迷走中</b><br>也可以按分享以後選<b>「儲存影像」</b>，存到手機相簿');
  lastBlob=await new Promise(r=>cv.toBlob(r,"image/jpeg",.92));
});
let dlCap=null;
(async()=>{try{dlCap=await window.claude?.use?.("downloads");}catch(e){}})();
document.getElementById("dl").addEventListener("click",async()=>{
  if(!lastBlob)return;
  if(dlCap){
    try{await dlCap.save({filename:FNAME(),data:lastBlob});
      msg('已下載！iPhone 在 Safari 下載的照片會放在「檔案」App；想存進「照片」可以<b>長按上面的照片</b> →「加入照片」');}
    catch(e){if(e&&e.code==="declined")return;
      msg('下載沒有成功，請<b>長按上面的照片</b> →「加入照片」或「儲存圖片」');}
    return;
  }
  let framed=false;try{framed=window.self!==window.top;}catch(e){framed=true;}
  if(framed){msg('這裡不能直接下載，請<b>長按上面的照片</b> →「加入照片」或「儲存圖片」');return;}
  const u=URL.createObjectURL(lastBlob);
  const a=document.createElement("a");a.href=u;a.download=FNAME();document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),4000);
  msg('已下載！iPhone 的照片會在「檔案」App；想直接存進「照片」，按「分享到 IG」再選<b>「儲存影像」</b>');
});
document.getElementById("share").addEventListener("click",async()=>{
  if(!lastBlob)return;
  const f=new File([lastBlob],FNAME(),{type:"image/jpeg"});
  if(!(navigator.canShare&&navigator.canShare({files:[f]}))){
    msg('這個瀏覽器不支援直接分享，請按「下載到裝置」或<b>長按照片</b>存下來，再打開 IG 上傳');return;}
  try{await navigator.share({files:[f]});}
  catch(e){if(e.name!=="AbortError")msg('分享沒有成功，請<b>長按照片</b>存下來，再打開 IG 上傳');}
});
document.getElementById("close").addEventListener("click",()=>{document.getElementById("sheet").hidden=true;});

loadImg(SAMPLE).then(i=>{st.img=i;refresh();});
texImg.onload=()=>refresh();
</script>
</body></html>
